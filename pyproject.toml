[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gax"
version = "0.1.0"
description = "Governed, durable execution of AI-proposed remediation actions: Claude proposes, versioned policy and approval decide, Temporal executes idempotently with per-attempt Keycard-issued credentials (LOCAL-ONLY offline mode), results are verified and audited."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio==1.33.0",
    "pymongo==4.18.2",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "anthropic==1.9.0",
    "pydantic==2.13.5",
    "fastapi==0.142.0",
    "uvicorn==0.54.0",
    "PyJWT==2.15.1",
    "keycardai-oauth==0.31.3",
]

[project.scripts]
gax = "gax.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires atlas-local on localhost:27017 and starts fleet-api",
    "keycard: live calls to the Keycard zone (mints real tokens); skipped unless KEYCARD_LIVE=1",
]
